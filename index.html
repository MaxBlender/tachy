<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tachy</title>
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tachy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f2f2f7; --card: #fff; --text: #111; --muted: #6b6b73; --line: #d9d9de;
  --accent: #0a84ff; --danger: #e5352b; --field: #fff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #9a9aa2; --line: #38383a; --accent: #4da3ff; --danger: #ff6a60; --field: #2c2c2e; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: var(--bg);
  border-bottom: 1px solid var(--line); }
header h1 { flex: 1; margin: 0; font-size: 20px; text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
header .side { min-width: 64px; display: flex; gap: 4px; }
header .side.right { justify-content: flex-end; }
main { max-width: 640px; margin: 0 auto; padding: 12px; }
button { font: inherit; color: var(--accent); background: none; border: 0; padding: 8px; cursor: pointer; border-radius: 8px; }
button:active { opacity: .5; }
button.primary { width: 100%; background: var(--accent); color: #fff; font-weight: 600; padding: 13px; border-radius: 12px; }
button.primary:disabled { opacity: .4; }
button.danger { color: var(--danger); }
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px; min-height: 52px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; padding: 10px 0; cursor: pointer; }
.row .title { display: flex; justify-content: space-between; gap: 8px; }
.row .muted, .muted { color: var(--muted); }
.row .note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .icon { font-size: 18px; padding: 10px; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }
.form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.pair { display: flex; gap: 12px; }
.pair > label { flex: 1; min-width: 0; }
label { display: block; }
label > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.inline { display: flex; align-items: center; gap: 12px; }
.inline > span { width: 130px; flex: none; font-size: 17px; color: var(--text); margin: 0; }
input { width: 100%; font: inherit; color: var(--text); background: var(--field);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
dialog { width: min(92vw, 380px); border: 0; border-radius: 16px; padding: 20px; background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { margin: 0 0 14px; font-size: 18px; text-align: center; }
dialog .form { margin-bottom: 8px; }
dialog .btns { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
dialog .btns button { flex: 1; }
dialog .btns button.ok { font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 15px; z-index: 20; }
.menu { position: fixed; z-index: 15; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 4px; min-width: 210px; }
.menu button { display: block; width: 100%; text-align: left; padding: 11px 14px; color: var(--text); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.mask { position: fixed; inset: 0; z-index: 14; }
</style>
</head>
<body>
<header>
  <div class="side" id="hl"></div>
  <h1 id="title"></h1>
  <div class="side right" id="hr"></div>
</header>
<main id="app"></main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <div class="form" id="dlgFields"></div>
    <div class="btns" id="dlgBtns"></div>
  </form>
</dialog>

<script>
'use strict';
const MAX_CODE = 5;
const KEY = 'tachy.projects.v1';

/* ---------- Модель и хранение ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'id' + Date.now().toString(36) + Math.random().toString(36).slice(2));

let projects = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; }
  catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(projects)); }
  catch { toast('Не удалось сохранить: память браузера недоступна'); }
}
const nextPointNumber = p => {
  const pts = p.stations.flatMap(s => s.points);
  return (pts.length ? pts[pts.length - 1].number : 0) + 1;
};
const exportRows = p => p.stations.flatMap(s => s.points).map(pt => [pt.number, pt.code]);
const exportText = p => exportRows(p).map(([n, c]) => `${n}, ${c}`).join('\n');

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeName = s => s.replace(/[\\/:*?"<>|]/g, '-');

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* Диалог с полями. fields: [{key,label,value,type,max,mode}] */
function dialog({ title, fields = [], ok = 'Сохранить', cancel = 'Отмена', danger = null, text = null }) {
  return new Promise(resolve => {
    const dlg = $('#dlg');
    $('#dlgTitle').textContent = title;
    const box = $('#dlgFields');
    box.innerHTML = (text ? `<div class="muted" style="text-align:center">${esc(text)}</div>` : '') +
      fields.map((f, i) => `<label><span>${esc(f.label)}</span>
        <input data-i="${i}" value="${esc(f.value ?? '')}" ${f.mode ? `inputmode="${f.mode}"` : ''}
          autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
          ${f.max ? `maxlength="${f.max}"` : ''}></label>`).join('');
    const btns = $('#dlgBtns');
    btns.innerHTML = `<button type="button" data-a="cancel">${esc(cancel)}</button>` +
      (danger ? `<button type="button" class="danger" data-a="danger">${esc(danger)}</button>` : '') +
      `<button type="submit" class="ok" data-a="ok">${esc(ok)}</button>`;
    let done = false;
    const finish = r => {
      if (done) return; done = true;
      const vals = {};
      fields.forEach((f, i) => vals[f.key] = box.querySelector(`[data-i="${i}"]`).value);
      dlg.close(); resolve(r === 'ok' ? { ok: true, vals } : { ok: false, danger: r === 'danger' });
    };
    btns.onclick = e => { const a = e.target.dataset.a; if (a === 'cancel' || a === 'danger') finish(a); };
    $('#dlgForm').onsubmit = e => { e.preventDefault(); finish('ok'); };
    dlg.oncancel = () => finish('cancel');
    dlg.showModal();
    const first = box.querySelector('input'); if (first) first.focus();
  });
}

function popupMenu(anchor, items) {
  document.querySelectorAll('.menu,.mask').forEach(e => e.remove());
  const mask = document.createElement('div'); mask.className = 'mask';
  const menu = document.createElement('div'); menu.className = 'menu';
  menu.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}">${esc(it.label)}</button>`).join('');
  const r = anchor.getBoundingClientRect();
  menu.style.top = (r.bottom + 4) + 'px';
  menu.style.right = Math.max(8, innerWidth - r.right) + 'px';
  const close = () => { menu.remove(); mask.remove(); };
  mask.onclick = close;
  menu.onclick = e => { const b = e.target.closest('button'); if (!b) return; close(); items[b.dataset.i].run(); };
  document.body.append(mask, menu);
}

/* ---------- Скачивание файлов ---------- */
async function saveFile(name, blob) {
  const file = new File([blob], name, { type: blob.type });
  // На телефоне открываем меню «Поделиться» (Файлы, AirDrop, почта и т.д.)
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const exportTxt = p => saveFile(safeName(p.name) + '.txt',
  new Blob([exportText(p)], { type: 'text/plain;charset=utf-8' }));
const exportXlsx = p => saveFile(safeName(p.name) + '.xlsx',
  new Blob([buildXlsx(exportRows(p))],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
const exportBackup = () => saveFile('tachy-backup-' + new Date().toISOString().slice(0, 10) + '.json',
  new Blob([JSON.stringify(projects, null, 1)], { type: 'application/json' }));

function importBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try {
      const data = JSON.parse(await inp.files[0].text());
      if (!Array.isArray(data) || data.some(p => !p || typeof p.name !== 'string' || !Array.isArray(p.stations)))
        throw 0;
      const r = await dialog({ title: 'Импорт копии', ok: 'Добавить', cancel: 'Отмена',
        text: `В файле проектов: ${data.length}. Они будут добавлены к текущим.` });
      if (!r.ok) return;
      data.forEach(p => { p.id = uid(); projects.push(p); });
      save(); render(); toast('Импортировано: ' + data.length);
    } catch { toast('Не удалось прочитать файл копии'); }
  };
  inp.click();
}

/* ---------- xlsx без библиотек (zip stored) ---------- */
function buildXlsx(rows) {
  const x = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const sheetRows = rows.map(([n, c], i) => {
    const r = i + 1;
    return `<row r="${r}"><c r="A${r}"><v>${n}</v></c><c r="B${r}" t="inlineStr"><is><t>${x(c)}</t></is></c></row>`;
  }).join('');
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const files = [
    ['[Content_Types].xml', H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
    ['_rels/.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', H + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="Points" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml', H + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      `<sheetData>${sheetRows}</sheetData></worksheet>`],
  ];
  return zipStored(files.map(([n, s]) => [n, new TextEncoder().encode(s)]));
}
const CRC = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t; })();
function crc32(d) { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStored(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const u16 = n => new Uint8Array([n & 255, (n >>> 8) & 255]);
  const u32 = n => new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
  const cat = a => { const out = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let o = 0; a.forEach(x => { out.set(x, o); o += x.length; }); return out; };
  for (const [name, data] of files) {
    const nm = enc.encode(name), crc = crc32(data);
    const local = cat([u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(33), u32(crc),
      u32(data.length), u32(data.length), u16(nm.length), u16(0), nm, data]);
    central.push(cat([u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(33), u32(crc),
      u32(data.length), u32(data.length), u16(nm.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), nm]));
    parts.push(local); offset += local.length;
  }
  const cd = cat(central);
  return cat([...parts, cd, u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cd.length), u32(offset), u16(0)]);
}

/* ---------- Экраны ---------- */
let route = { name: 'projects' };   // {name:'projects'} | {name:'stations',p} | {name:'station',p,s}
const stationDraft = {};            // черновик полей ввода станции (по id), чтобы не терялся при ререндере

function go(r) { route = r; render(); scrollTo(0, 0); history.pushState({ r }, ''); }
function back() { history.back(); }
addEventListener('popstate', () => {
  if (route.name === 'station') route = { name: 'stations', p: route.p };
  else route = { name: 'projects' };
  render();
});

const findP = id => projects.find(p => p.id === id);
const findS = (p, id) => p && p.stations.find(s => s.id === id);

function render() {
  if (route.name === 'projects') return renderProjects();
  const p = findP(route.p);
  if (!p) { route = { name: 'projects' }; return renderProjects(); }
  if (route.name === 'stations') return renderStations(p);
  const s = findS(p, route.s);
  if (!s) { route = { name: 'stations', p: p.id }; return renderStations(p); }
  renderStation(p, s);
}

function setHeader(title, left, right) {
  $('#title').textContent = title; document.title = title + ' · Tachy';
  $('#hl').innerHTML = left; $('#hr').innerHTML = right;
}

function renderProjects() {
  setHeader('Проекты', '',
    `<button id="bMenu" aria-label="Меню">⋯</button><button id="bAdd" aria-label="Новый проект" style="font-size:26px;padding:2px 8px">+</button>`);
  $('#app').innerHTML = projects.length
    ? `<div class="list">${projects.map(p => `
        <div class="row" data-id="${p.id}">
          <div class="main" data-act="open"><div class="title"><span>${esc(p.name)}</span>
            <span class="muted">${p.stations.length} ст.</span></div></div>
          <button class="icon" data-act="rename" aria-label="Изменить">✎</button>
          <button class="icon danger" data-act="del" aria-label="Удалить">🗑</button>
        </div>`).join('')}</div>`
    : '<div class="empty">Нажмите + чтобы создать проект</div>';

  $('#bAdd').onclick = async () => {
    const r = await dialog({ title: 'Новый проект', ok: 'Создать', fields: [{ key: 'n', label: 'Название' }] });
    const name = r.ok && r.vals.n.trim();
    if (name) { projects.push({ id: uid(), name, stations: [] }); save(); render(); }
  };
  $('#bMenu').onclick = e => popupMenu(e.currentTarget, [
    { label: 'Сохранить копию (.json)', run: exportBackup },
    { label: 'Загрузить копию…', run: importBackup },
  ]);
  $('#app').onclick = async e => {
    const row = e.target.closest('.row'); const b = e.target.closest('[data-act]'); if (!row || !b) return;
    const p = findP(row.dataset.id), act = b.dataset.act;
    if (act === 'open') go({ name: 'stations', p: p.id });
    if (act === 'rename') {
      const r = await dialog({ title: 'Название проекта', fields: [{ key: 'n', label: 'Название', value: p.name }] });
      const name = r.ok && r.vals.n.trim(); if (name) { p.name = name; save(); render(); }
    }
    if (act === 'del') {
      const r = await dialog({ title: 'Удалить проект?', ok: 'Удалить', text: `«${p.name}» и все его станции и точки будут удалены.` });
      if (r.ok) { projects = projects.filter(x => x !== p); save(); render(); }
    }
  };
}

function renderStations(p) {
  setHeader(p.name, `<button id="bBack">‹ Назад</button>`,
    `<button id="bExp" aria-label="Выгрузка" style="font-size:20px">⇪</button><button id="bAdd" aria-label="Добавить станцию" style="font-size:26px;padding:2px 8px">+</button>`);
  $('#app').innerHTML = p.stations.length
    ? `<div class="list">${p.stations.map(s => `
        <div class="row" data-id="${s.id}">
          <div class="main" data-act="open"><div class="title"><span>${esc(s.name)}</span>
            <span class="muted">${s.points.length} т.</span></div></div>
          <button class="icon" data-act="rename" aria-label="Изменить">✎</button>
          <button class="icon danger" data-act="del" aria-label="Удалить">🗑</button>
        </div>`).join('')}</div>`
    : '<div class="empty">Нажмите + чтобы добавить станцию</div>';

  $('#bBack').onclick = back;
  $('#bAdd').onclick = () => { p.stations.push({ id: uid(), name: `СТ ${p.stations.length + 1}`, backsight: '', resection: '', points: [] }); save(); render(); };
  $('#bExp').onclick = e => popupMenu(e.currentTarget, [
    { label: 'Текст (.txt)', run: () => exportTxt(p) },
    { label: 'Excel (.xlsx)', run: () => exportXlsx(p) },
  ]);
  $('#app').onclick = async e => {
    const row = e.target.closest('.row'); const b = e.target.closest('[data-act]'); if (!row || !b) return;
    const s = findS(p, row.dataset.id), act = b.dataset.act;
    if (act === 'open') go({ name: 'station', p: p.id, s: s.id });
    if (act === 'rename') {
      const r = await dialog({ title: 'Название станции', fields: [{ key: 'n', label: 'Название', value: s.name }] });
      const name = r.ok && r.vals.n.trim(); if (name) { s.name = name; save(); render(); }
    }
    if (act === 'del') {
      const r = await dialog({ title: 'Удалить станцию?', ok: 'Удалить', text: `«${s.name}» и её точки (${s.points.length}) будут удалены.` });
      if (r.ok) { p.stations = p.stations.filter(x => x !== s); save(); render(); }
    }
  };
}

function renderStation(p, s) {
  // Номер по умолчанию: следующий после последней точки станции (или после последней точки проекта)
  const d = stationDraft[s.id] ||= { code: '', note: '', num: String((s.points.length ? s.points[s.points.length - 1].number : nextPointNumber(p) - 1) + 1) };
  setHeader(s.name, `<button id="bBack">‹ Назад</button>`, '');
  $('#app').innerHTML = `
    <div class="form">
      <div class="pair">
        <label><span>Обнуление</span><input id="fBack" value="${esc(s.backsight)}" placeholder="№ пункта" autocomplete="off" autocapitalize="off"></label>
        <label><span>Засечка</span><input id="fRes" value="${esc(s.resection)}" placeholder="№ пункта" autocomplete="off" autocapitalize="off"></label>
      </div>
      <label class="inline"><span>Номер точки</span><input id="fNum" inputmode="numeric" pattern="[0-9]*" placeholder="100" value="${esc(d.num)}"></label>
      <label class="inline"><span>Код точки</span><input id="fCode" maxlength="${MAX_CODE}" placeholder="пк" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(d.code)}"></label>
      <label class="inline"><span>Пояснение</span><input id="fNote" placeholder="заметка" autocomplete="off" value="${esc(d.note)}"></label>
      <button class="primary" id="bOk">OK</button>
    </div>
    ${s.points.length ? `<div class="list">${[...s.points].reverse().map(pt => `
      <div class="row" data-id="${pt.id}"><div class="main" data-act="edit">
        <div class="title"><span>${pt.number}</span><span class="muted">${esc(pt.code)} ✎</span></div>
        ${pt.note ? `<div class="note">${esc(pt.note)}</div>` : ''}
      </div></div>`).join('')}</div>` : ''}`;

  const num = () => /^\d+$/.test($('#fNum').value.trim()) ? parseInt($('#fNum').value.trim(), 10) : null;
  const sync = () => { $('#bOk').disabled = num() === null; };
  $('#fBack').oninput = e => { s.backsight = e.target.value; save(); };
  $('#fRes').oninput = e => { s.resection = e.target.value; save(); };
  $('#fNum').oninput = e => { d.num = e.target.value; sync(); };
  $('#fCode').oninput = e => { d.code = e.target.value.slice(0, MAX_CODE); e.target.value = d.code; };
  $('#fNote').oninput = e => { d.note = e.target.value; };
  sync();

  $('#bBack').onclick = back;
  $('#bOk').onclick = () => {
    const n = num(); if (n === null) return;
    s.points.push({ id: uid(), number: n, code: d.code.trim(), note: d.note.trim() });
    save();
    d.num = String(n + 1);   // код остаётся прежним
    d.note = '';             // пояснение относится к одной точке
    render();
  };
  $('#app').onclick = async e => {
    const row = e.target.closest('.row'); if (!row || !e.target.closest('[data-act="edit"]')) return;
    const pt = s.points.find(x => x.id === row.dataset.id);
    const r = await dialog({ title: 'Точка', danger: 'Удалить', fields: [
      { key: 'n', label: 'Номер', value: pt.number, mode: 'numeric' },
      { key: 'c', label: 'Код', value: pt.code, max: MAX_CODE },
      { key: 't', label: 'Пояснение', value: pt.note },
    ] });
    if (r.ok) {
      pt.code = r.vals.c.trim().slice(0, MAX_CODE); pt.note = r.vals.t.trim();
      if (/^\d+$/.test(r.vals.n.trim())) pt.number = parseInt(r.vals.n.trim(), 10);
      save(); render();
    } else if (r.danger) { s.points = s.points.filter(x => x !== pt); save(); render(); }
  };
}

/* ---------- Запуск ---------- */
history.replaceState({ r: route }, '');
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:')
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
